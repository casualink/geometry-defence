<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Defense</title>
<style>
:root{--cyan:#55e7ff;--pink:#ff5da8;--gold:#ffd166;--panel:rgba(10,17,42,.78)}
*{box-sizing:border-box}
body{margin:0;height:100vh;min-height:0;color:#f4ffe9;font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#3c8b43,#174c2b 75%,#10351f)}
body:before{content:"";position:fixed;inset:0;z-index:-2;background-image:repeating-linear-gradient(35deg,transparent 0 24px,#ffffff08 25px 27px,transparent 28px 52px),repeating-linear-gradient(125deg,transparent 0 34px,#092b1422 35px 38px,transparent 39px 70px);background-size:100px 100px}
body:after{content:"";position:fixed;inset:0;z-index:-1;opacity:.24;background-image:radial-gradient(ellipse at 20% 25%,#b6e878 0 2px,transparent 3px),radial-gradient(ellipse at 75% 65%,#b6e878 0 2px,transparent 3px),radial-gradient(ellipse at 45% 85%,#0b3016 0 3px,transparent 4px);background-size:47px 39px}
.stars{display:none}
main{width:100vw;height:100dvh;max-height:100dvh;margin:0;padding:0;display:block;position:relative;overflow:hidden}
header{text-align:center;position:absolute;z-index:3;top:9px;left:50%;transform:translateX(-50%);width:max-content;max-width:95vw;pointer-events:none}
h1{margin:0;font-size:clamp(1.35rem,3.3vh,2.3rem);letter-spacing:.08em;font-weight:900;color:#f4ffe9;text-shadow:0 2px 12px #102b16}
.subtitle{color:#d1edbd;margin-top:2px;letter-spacing:.12em;font-size:clamp(.58rem,1.3vh,.72rem)}
.stats{position:absolute;z-index:3;top:68px;left:12px;right:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;pointer-events:none}
.stat,.shop,.game-wrap{background:rgba(12,43,25,.83);border:1px solid #b9ed9b55;box-shadow:0 7px 22px #061b0c55,inset 0 1px #ffffff12;backdrop-filter:blur(8px);border-radius:12px}
.stat{padding:6px 11px}.stat small{display:block;color:#c4dfb5;font-size:.59rem;letter-spacing:.13em}.stat strong{font-size:clamp(1rem,2.5vh,1.35rem)}
.coin{color:var(--gold)}.wave{color:#e0c2ff}.life{color:#9bffad}.kills{color:#a9f4ff}
.game-wrap{position:absolute;z-index:0;inset:0;padding:0;overflow:hidden;border:0;border-radius:0;box-shadow:none;background:transparent;display:block}
canvas{display:block;width:100%;height:100%;max-height:none;object-fit:fill;border-radius:0;background:#397d39;touch-action:manipulation}
#message{position:absolute;inset:10px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;border-radius:11px;background:#05091be8;text-align:center}
#message h2{font-size:2.5rem;margin:0;color:#ff79aa}#message p{color:#c5d1ee}
button{font:inherit;color:#effaff;border:1px solid #79dfff55;background:linear-gradient(135deg,#173c65,#29245d);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.18s;box-shadow:0 5px 18px #0003}
button:hover{transform:translateY(-2px);border-color:#7deaff;filter:brightness(1.2)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.shop{position:absolute;z-index:3;left:12px;bottom:12px;width:min(590px,58vw);padding:7px 9px}
.shop h2{margin:0 0 5px;font-size:.76rem;letter-spacing:.12em;color:#e1f7d3}
.upgrades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.upgrade{text-align:left;min-height:0;padding:7px 9px;font-size:.82rem}.upgrade b{display:block;margin-bottom:2px}.upgrade span{font-size:.68rem;color:#d0e6c4}
.footer{position:absolute;z-index:3;right:12px;bottom:12px;display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;color:#f0ffe8;font-size:.68rem;text-shadow:0 1px 3px #102b16;max-width:38vw}
.footer button{padding:6px 12px}
@media(max-width:620px){header{top:6px}h1{font-size:1.25rem}.subtitle{display:none}.stats{top:43px;left:6px;right:6px;gap:3px}.stat{padding:4px 5px}.stat small{font-size:.45rem;letter-spacing:.02em}.stat strong{font-size:.95rem}.shop{left:6px;bottom:6px;width:min(74vw,430px);padding:5px}.shop h2{font-size:.62rem}.upgrades{grid-template-columns:repeat(2,1fr);gap:3px}.upgrade{padding:5px 6px;font-size:.65rem}.upgrade span{font-size:.55rem}.footer{right:6px;bottom:6px;max-width:24vw;font-size:.52rem}.footer>span{display:none}.footer button{font-size:.62rem;padding:5px 7px}}
@media(max-height:650px){.shop{padding:5px 8px}.shop h2{margin-bottom:3px}.upgrade{padding:5px 7px}.stat{padding:4px 8px}}
</style>
</head>
<body><div class="stars"></div>
<main>
<header><h1>GEOMETRY DEFENSE</h1><div style='font-size:11px;color:#e8ffe0;text-shadow:0 1px 3px #173b20'>Tanque · Veloz · Escudo · Curandeiro · Divisor · Boss a cada 5 ondas</div><div class="subtitle">DEFENDA O NÚCLEO • SOBREVIVA ÀS ONDAS</div></header>
<section class="stats">
 <div class="stat"><small>MOEDAS</small><strong class="coin">◈ <span id="coins">0</span></strong></div>
 <div class="stat"><small>ONDA</small><strong class="wave"><span id="wave">1</span></strong></div>
 <div class="stat"><small>VIDA DO NÚCLEO</small><strong class="life">♥ <span id="hp">100</span></strong></div>
 <div class="stat"><small>ELIMINAÇÕES</small><strong class="kills"><span id="kills">0</span></strong></div>
</section>
<div class="game-wrap">
 <canvas id="arena" width="900" height="560"></canvas>
 <div id="message"><h2>FIM DE JOGO</h2><p id="result"></p><button id="restart">↻ JOGAR NOVAMENTE</button></div>
</div>
<section class="shop">
 <h2>⚡ CENTRAL DE UPGRADES</h2>
 <div class="upgrades">
  <button class="upgrade" id="damage"><b>✦ Dano</b><span id="damageInfo"></span></button>
  <button class="upgrade" id="speed"><b>➤ Velocidade</b><span id="speedInfo"></span></button>
  <button class="upgrade" id="multi"><b>⌖ Mais cursores</b><span id="multiInfo"></span></button>
  <button class="upgrade" id="heal"><b>♥ Reparar núcleo</b><span>Recupere 30 de vida · 25 ◈</span></button>
 </div>
</section>
<div class="footer"><span>Os cursores atacam automaticamente o inimigo mais próximo.</span><button id="pause">Ⅱ PAUSAR</button></div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('arena'),ctx=canvas.getContext('2d');
const W=900,H=560,cx=W/2,cy=H/2;
const route=[[-35,95],[115,95],[115,205],[285,205],[285,75],[475,75],[475,330],[650,330],[650,170],[790,170],[790,455],[cx,455],[cx-92,cy+8]];
function routePoint(progress){
 let lengths=[],total=0;
 for(let i=1;i<route.length;i++){let d=Math.hypot(route[i][0]-route[i-1][0],route[i][1]-route[i-1][1]);lengths.push(d);total+=d}
 let dist=Math.min(progress,total),idx=0;
 while(idx<lengths.length-1&&dist>lengths[idx]){dist-=lengths[idx];idx++}
 let a=route[idx],b=route[idx+1],t=dist/lengths[idx];
 return {x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,total};
}
let coins,wave,hp,kills,damage,rate,multi,enemies,shots,spawn,paused,over,last,elapsed,angle,stars=[];
function reset(){
 coins=0;wave=1;hp=100;kills=0;damage=1;rate=1;multi=1;enemies=[];shots=[];spawn=0;paused=false;over=false;last=0;elapsed=0;angle=0;bossSpawned=false;
 $('message').style.display='none';$('pause').textContent='Ⅱ PAUSAR';update();
}
function update(){
 $('coins').textContent=coins;$('wave').textContent=wave;$('hp').textContent=Math.max(0,hp);$('kills').textContent=kills;
 $('damageInfo').textContent=`Nível ${damage} · ${20*damage} moedas`;
 $('speedInfo').textContent=`Nível ${rate} · ${25*rate} moedas`;
 $('multiInfo').textContent=`Nível ${multi} · ${40*multi} moedas`;
 $('damage').disabled=over||coins<20*damage;$('speed').disabled=over||coins<25*rate;$('multi').disabled=over||coins<40*multi;$('heal').disabled=over||coins<25||hp>=100;
}
function poly(x,y,r,n,rot=0){ctx.beginPath();for(let i=0;i<n;i++){let a=rot+i*Math.PI*2/n,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}

let bossSpawned=false;
function spawnEnemy(forceBoss=false,small=false){
 let p=routePoint(0),roll=Math.random(),type='normal',n=3,r=16;
 if(forceBoss){type='boss';n=8;r=34}
 else if(small){type='runner';n=3;r=11}
 else {
  // A chance de especiais cresce a cada onda e fica bem frequente nas ondas avançadas.
  let specialChance=Math.min(.72,.10+wave*.035);
  if(roll<specialChance*.20){type='tank';n=6;r=25}
  else if(roll<specialChance*.40){type='runner';n=3;r=14}
  else if(roll<specialChance*.60){type='shield';n=6;r=23}
  else if(roll<specialChance*.80){type='healer';n=5;r=22}
  else if(roll<specialChance){type='splitter';n=5;r=22}
  else {n=Math.random()<.42?3:Math.random()<.72?4:5;r=n===3?16:n===4?20:23}
 }
 let base=(n===3?3:n===4?6:n===5?9:18);
 let hpScale={tank:3.2,runner:.72,shield:2.5,healer:1.8,splitter:1.65,boss:22}[type]||1;
 let speedScale={tank:.62,runner:1.85,shield:.78,healer:.86,splitter:1.12,boss:.48}[type]||1;
 let max=Math.round((base+wave*1.7)*hpScale);
 enemies.push({x:p.x,y:p.y,progress:0,r,n,hp:max,max,speed:(.31+wave*.045+Math.random()*.12)*speedScale,rot:Math.random()*6,type,abilityTimer:0});
 if(type==='boss')bossSpawned=true;
}
function fire(){
 if(!enemies.length)return;
 let target=enemies.reduce((a,b)=>Math.hypot(a.x-cx,a.y-cy)<Math.hypot(b.x-cx,b.y-cy)?a:b);
 for(let i=0;i<multi;i++){let t=(i-(multi-1)/2)*.13,dx=target.x-cx,dy=target.y-cy,d=Math.hypot(dx,dy)||1,vx=dx/d,vy=dy/d,co=Math.cos(t),si=Math.sin(t);shots.push({x:cx,y:cy,vx:vx*co-vy*si,vy:vx*si+vy*co,life:85,power:damage})}
}
function end(){over=true;$('message').style.display='flex';$('result').textContent=`Você chegou à onda ${wave} e eliminou ${kills} formas.`;update()}
function drawBackground(){
 ctx.clearRect(0,0,W,H);
 let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#4f9c49');g.addColorStop(.5,'#347b3d');g.addColorStop(1,'#245f35');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // Textura de grama
 for(let i=0;i<170;i++){let x=(i*173+37)%W,y=(i*97+19)%H;ctx.strokeStyle=i%2?'#b6e87835':'#102f1835';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+3,y-5);ctx.stroke()}
 // Caminho sinuoso para os inimigos
 ctx.beginPath();route.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
 ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#765638';ctx.lineWidth=66;ctx.stroke();
 ctx.strokeStyle='#b99a68';ctx.lineWidth=54;ctx.stroke();
 ctx.strokeStyle='#d7bd88';ctx.lineWidth=2;ctx.setLineDash([9,13]);ctx.stroke();ctx.setLineDash([]);
 // Clareira e anel de proteção do núcleo, fora do caminho
 ctx.beginPath();ctx.arc(cx,cy,66,0,Math.PI*2);ctx.fillStyle='#1b572e';ctx.fill();
 ctx.strokeStyle='#d9ffbd99';ctx.lineWidth=3;ctx.setLineDash([5,7]);ctx.stroke();ctx.setLineDash([]);
}
function draw(){
 drawBackground();
 for(let e of enemies){
  poly(e.x,e.y,e.r,e.n,e.rot);
  let color=e.type==='boss'?'#ff625e':e.type==='tank'?'#6bc5e8':e.type==='runner'?'#fff078':e.type==='shield'?'#58e0c2':e.type==='healer'?'#ff83d0':e.type==='splitter'?'#ff9b55':e.n===3?'#ff9eae':e.n===4?'#ffe08a':'#c9a7ff';
  ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=e.type==='boss'?22:10;ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle=e.type==='boss'?'#fff3b0':'#fff4df';ctx.lineWidth=e.type==='boss'?5:3;ctx.stroke();
  if(e.type==='boss'){ctx.beginPath();ctx.arc(e.x,e.y,e.r+8,0,Math.PI*2);ctx.strokeStyle='#ffb34d';ctx.lineWidth=3;ctx.stroke()}
  if(e.type==='tank'){ctx.beginPath();ctx.arc(e.x,e.y,e.r-6,0,Math.PI*2);ctx.strokeStyle='#e4f8ff';ctx.lineWidth=4;ctx.stroke()}
  if(e.type==='shield'){ctx.beginPath();ctx.arc(e.x,e.y,e.r+7,0,Math.PI*2);ctx.strokeStyle='#a8fff0';ctx.lineWidth=3;ctx.stroke()}
  if(e.type==='healer'){ctx.fillStyle='#fff';ctx.font='bold 19px Arial';ctx.textAlign='center';ctx.fillText('+',e.x,e.y+7)}
  if(e.type==='splitter'){ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('✣',e.x,e.y+4)}
  ctx.fillStyle='#29452d';ctx.fillRect(e.x-e.r,e.y-e.r-13,e.r*2,6);
  ctx.fillStyle=e.type==='boss'?'#ffdf55':'#a7f3a0';ctx.fillRect(e.x-e.r,e.y-e.r-13,e.r*2*Math.max(0,e.hp/e.max),6);
  if(e.type==='boss'){ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('BOSS',e.x,e.y-e.r-19)}
  else if(['tank','runner','shield','healer','splitter'].includes(e.type)){ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillStyle='#20352b';ctx.fillText(({tank:'TQ',runner:'RÁPIDO',shield:'ESCUDO',healer:'CURA',splitter:'DIVIDE'})[e.type],e.x,e.y+3)}
 }
 for(let s of shots){
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.atan2(s.vy,s.vx)+Math.PI/2);ctx.shadowColor='#5cecff';ctx.shadowBlur=15;ctx.fillStyle='#9af5ff';ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(7,5);ctx.lineTo(1,3);ctx.lineTo(0,11);ctx.lineTo(-1,3);ctx.lineTo(-7,5);ctx.closePath();ctx.fill();ctx.restore();
 }
 ctx.save();ctx.translate(cx,cy);
 ctx.shadowColor='#c8ff9b';ctx.shadowBlur=30;
 let grad=ctx.createRadialGradient(-8,-9,2,0,0,34);
 grad.addColorStop(0,'#ffffff');grad.addColorStop(.42,'#c9ffab');grad.addColorStop(1,'#54b978');
 ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,34,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;ctx.strokeStyle='#f1ffe7';ctx.lineWidth=3;ctx.stroke();
 ctx.restore();
}
function loop(ts){
 requestAnimationFrame(loop);if(!last)last=ts;let dt=Math.min(ts-last,40);last=ts;
 if(!paused&&!over){
  elapsed+=dt;angle+=dt*.001;
  let interval=Math.max(300,1350-wave*65);spawn+=dt;
  if(wave%5===0&&!bossSpawned&&spawn>900){spawnEnemy(true);spawn=0}
  else if(spawn>interval){spawn=0;spawnEnemy();if(Math.random()<Math.min(.78,.18+wave*.035))spawnEnemy()}
  if(elapsed>=20000){elapsed=0;wave++;bossSpawned=false;update()}
  if(Math.floor(elapsed/(850/rate))!==Math.floor((elapsed-dt)/(850/rate)))fire();
  for(let e of enemies){
   e.progress+=e.speed*dt*.06;let p=routePoint(e.progress);e.x=p.x;e.y=p.y;e.rot+=dt*.0005;
   if(e.type==='healer'){
    e.abilityTimer+=dt;
    if(e.abilityTimer>1900){e.abilityTimer=0;for(let ally of enemies){if(ally!==e&&Math.hypot(ally.x-e.x,ally.y-e.y)<125)ally.hp=Math.min(ally.max,ally.hp+Math.ceil(ally.max*.12))}}
   }
   if(e.progress>=p.total-2)e.hit=true;
  }
  for(let e of enemies.filter(e=>e.hit)){hp-=e.type==='boss'?35:e.type==='tank'?18:Math.max(5,Math.ceil(e.max/3));enemies.splice(enemies.indexOf(e),1);if(hp<=0){hp=0;end()}}
  for(let s of shots){s.x+=s.vx*8;s.y+=s.vy*8;s.life--}
  for(let s of shots)for(let e of enemies)if(!s.dead&&Math.hypot(s.x-e.x,s.y-e.y)<e.r+7){e.hp-=s.power*(e.type==='shield'?.55:1);s.dead=true;
   if(e.hp<=0){
    e.dead=true;coins+=(e.type==='boss'?100:e.type==='tank'?18:e.type==='runner'?8:e.type==='healer'?16:e.type==='shield'?20:e.type==='splitter'?22:5)+wave*2;kills++;
    if(e.type==='splitter'){for(let k=0;k<2;k++){let child=routePoint(Math.max(0,e.progress-2));enemies.push({x:child.x,y:child.y,progress:Math.max(0,e.progress-2),r:10,n:3,hp:Math.max(2,Math.ceil(e.max*.22)),max:Math.max(2,Math.ceil(e.max*.22)),speed:e.speed*1.55,rot:Math.random()*6,type:'runner',abilityTimer:0})}}
    update();
   }}
  shots=shots.filter(s=>s.life>0&&!s.dead);enemies=enemies.filter(e=>!e.dead);update();
 }
 draw();
}
$('damage').onclick=()=>{let c=20*damage;if(coins>=c){coins-=c;damage++;update()}};
$('speed').onclick=()=>{let c=25*rate;if(coins>=c){coins-=c;rate++;update()}};
$('multi').onclick=()=>{let c=40*multi;if(coins>=c){coins-=c;multi++;update()}};
$('heal').onclick=()=>{if(coins>=25&&hp<100){coins-=25;hp=Math.min(100,hp+30);update()}};
$('pause').onclick=()=>{if(over)return;paused=!paused;$('pause').textContent=paused?'▶ CONTINUAR':'Ⅱ PAUSAR'};
$('restart').onclick=reset;
reset();requestAnimationFrame(loop);
})();
</script>
</body></html>
